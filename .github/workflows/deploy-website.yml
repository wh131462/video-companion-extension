name: Deploy Website to GitHub Pages

on:
  # 触发条件：push 到 master 分支
  push:
    branches:
      - master
    # 只有 website 目录或工作流文件变更时触发
    paths:
      - 'website/**'
      - 'docs/snapshots/**'
      - 'manifest.json'
      - '.github/workflows/deploy-website.yml'

  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare website files
        run: |
          # 复制截图到 website 目录
          mkdir -p website/snapshots
          cp docs/snapshots/*.png website/snapshots/

          # 复制扩展图标作为 favicon
          mkdir -p website/assets/images
          cp public/icons/icon128.png website/assets/images/favicon-128.png
          cp public/icons/icon48.png website/assets/images/favicon-48.png
          cp public/icons/icon16.png website/assets/images/favicon-16.png

          # 从 manifest.json 生成 version.json
          node scripts/sync-website-version.mjs

          # 显示文件结构
          echo "Website files:"
          find website -type f | head -30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
