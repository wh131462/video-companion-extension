<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Companion</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部 -->
    <header class="popup-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <span class="title">Video Companion</span>
      </div>
      <span class="version" id="version"></span>
    </header>

    <!-- 功能开关 -->
    <div class="switch-section">
      <!-- 控制面板开关 -->
      <div class="switch-row">
        <div class="switch-info">
          <span class="switch-label">控制面板</span>
          <span class="switch-desc">视频底部悬浮面板</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="panel-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- 右键菜单开关 -->
      <div class="switch-row">
        <div class="switch-info">
          <span class="switch-label">右键菜单</span>
          <span class="switch-desc">视频增强右键菜单</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="context-menu-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- 视频信息 -->
    <div class="video-info" id="video-info">
      <div class="info-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </div>
      <span id="video-count">检测中...</span>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <button class="action-btn" id="pip-btn" title="画中画">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <rect x="12" y="9" width="8" height="6" rx="1" fill="currentColor"></rect>
        </svg>
        <span>画中画</span>
      </button>
      <button class="action-btn" id="screenshot-btn" title="截图">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>截图</span>
      </button>
      <button class="action-btn" id="fullscreen-btn" title="全屏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <span>全屏</span>
      </button>
    </div>

    <!-- 底部链接 -->
    <footer class="popup-footer">
      <a href="https://github.com/wh131462/video-companion-extension" target="_blank" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        GitHub
      </a>
    </footer>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
